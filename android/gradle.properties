org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Diubah ke true: file_picker 11 tidak lagi meng-apply Kotlin plugin sendiri
# saat AGP >= 9, jadi folder src/main/kotlin-nya hanya terkompilasi kalau
# built-in Kotlin AGP aktif. Dengan false, FilePickerPlugin.kt tidak pernah
# dikompilasi dan build gagal di GeneratedPluginRegistrant.
android.builtInKotlin=true
# Cache inkremental Kotlin gagal ditutup di mesin ini
# ("Could not close incremental caches ... class-fq-name-to-source.tab"),
# terutama untuk plugin baru seperti url_launcher_android dan
# shared_preferences_android. Mematikannya membuat build stabil.
kotlin.incremental=false
